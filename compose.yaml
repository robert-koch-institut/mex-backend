services:
  mex-backend:
    build:
      context: .
    ports:
      - 8080:8080
    environment:
      - MEX_GRAPH_URL=neo4j://neo4j:7687
      - MEX_BACKEND_VALKEY_URL=valkey://valkey:6379
    healthcheck:
      test: [ "CMD", "curl", "http://0.0.0.0:8080/v0/_system/check" ]
      interval: 60s
      timeout: 5s
      retries: 5
  neo4j:
    image: neo4j:2026.07-community@sha256:dca31d0d938dd8bb199c8846abedd897c3a07ddb629eca46a8009ac9e87aece2
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_dbms_usage__report_enabled=false
    ports:
      - 7687:7687
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  valkey:
    image: valkey/valkey:9.1.1@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  slapd:
    image: thoteam/slapd-server-mock@sha256:f1f976cab47facefc1128d7ebd6b26e20c725fbb990b07e40e79801ec8b77b1f
    platform: linux/amd64
    ports:
      - 636:636
    volumes:
      - ./assets/raw-data/ldap/:/bootstrap/
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-o", "tls_reqcert=never", "-H", "ldaps://localhost:636", "-b", "dc=ldapmock,dc=local", "-D", "cn=admin,dc=ldapmock,dc=local", "-w", "adminpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  dex:
    image: ghcr.io/dexidp/dex:v2.42.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - 5556:5556
    volumes:
      - ./assets/raw-data/dex/config.yaml:/etc/dex/config.yaml:ro
    depends_on:
      slapd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5556/dex/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  http-test-server:
    build:
      context: .
    ports:
      - 8088:8088
    entrypoint: http-test-server
